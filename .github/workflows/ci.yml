name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: clippy, rustfmt
      - run: cargo fmt -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  dylint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.1
      - name: Install dylint
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-dylint@6.3.2,dylint-link@6.3.2

      # The nightly that rust-toolchain.toml in the dylint-lints repository pins for the lint
      - name: Install the dylint nightly
        run: rustup toolchain install nightly-2026-08-20 --profile minimal --component rustc-dev --component llvm-tools-preview
      - name: Dylint
        env:
          DYLINT_RUSTFLAGS: "-D warnings"
        run: cargo dylint --all -- --all-targets

  # On main: next version from conventional commits (feat minor, breaking major, else patch), publish, tag, release
  release:
    needs: [test, dylint]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable

      - name: Next version
        id: version
        run: |
          LAST=$(git describe --tags --abbrev=0 2>/dev/null || true)
          SUBJECTS=$(git log ${LAST:+"$LAST"..HEAD} --pretty=format:%s)
          if [ -z "$SUBJECTS" ] || ! echo "$SUBJECTS" | grep -qvE '^(chore|docs|ci)(\(.*\))?:'; then
            echo "nothing to release since ${LAST:-the start}"
            exit 0
          fi
          if [ -z "$LAST" ]; then
            V=0.1.0
          else
            IFS=. read -r MA MI PA <<< "${LAST#v}"
            if echo "$SUBJECTS" | grep -qE '^(BREAKING CHANGE:|breaking(\(.*\))?:)'; then V="$((MA + 1)).0.0"
            elif echo "$SUBJECTS" | grep -qE '^feat(\(.*\))?:'; then V="$MA.$((MI + 1)).0"
            else V="$MA.$MI.$((PA + 1))"; fi
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "releasing v$V"

      # Publish first: a tag without a crate is worse than a crate without a tag, and a retry then tags it
      - name: Publish to crates.io
        if: steps.version.outputs.version
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sed -i "0,/^version = .*/s//version = \"$VERSION\"/" Cargo.toml
          cargo publish --allow-dirty

      - name: Tag and release
        if: steps.version.outputs.version
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes
